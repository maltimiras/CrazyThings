<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Demo Recorder · Recordings</title>
  <style>
    :root { --b: #e5e7eb; --m: #6b7280; --p: #4f46e5; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.45 system-ui, -apple-system, sans-serif; color: #111827; background: #f8fafc; display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
    aside { border-right: 1px solid var(--b); background: #fff; overflow: auto; }
    aside h1 { font-size: 15px; margin: 0; padding: 16px; border-bottom: 1px solid var(--b); }
    .import { padding: 12px 16px; border-bottom: 1px solid var(--b); display: grid; gap: 6px; }
    .import button { width: 100%; }
    aside.drop { outline: 3px dashed var(--p); outline-offset: -6px; background: #eef2ff; }
    #import-msg { font-size: 12px; }
    .setlink { font-size: 13px; color: var(--p); text-decoration: none; }
    .keyrow { display: inline-flex; gap: 4px; }
    .keyrow input { width: 160px !important; flex: none !important; }
    .keyrow button { padding: 4px 8px; }
    #key-result.ok { color: #047857; }
    #key-result.bad { color: #b91c1c; }
    #import-msg.bad { color: #b91c1c; }
    #import-msg.warn { color: #b45309; }
    .sess { padding: 10px 16px; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
    .sess:hover { background: #f8fafc; }
    .sess.on { background: #eef2ff; }
    .sess b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sess small { color: var(--m); }
    main { overflow: auto; padding: 24px 32px; }
    .empty { color: var(--m); padding: 60px; text-align: center; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    input[type=text], select, textarea { font: inherit; border: 1px solid #d1d5db; border-radius: 8px; padding: 7px 10px; background: #fff; }
    #title { font-size: 20px; font-weight: 600; width: 100%; max-width: 640px; border-color: transparent; padding-left: 4px; }
    #title:hover, #title:focus { border-color: #d1d5db; }
    button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; }
    button.primary { background: var(--p); border-color: var(--p); color: #fff; font-weight: 600; }
    button.danger { color: #b91c1c; }
    button:disabled { opacity: .5; cursor: default; }
    .card { background: #fff; border: 1px solid var(--b); border-radius: 12px; padding: 16px; margin: 16px 0; }
    .muted { color: var(--m); font-size: 13px; }
    table { width: 100%; border-collapse: collapse; }
    td { padding: 8px 6px; border-top: 1px solid #f1f5f9; vertical-align: top; }
    td.n { color: var(--m); width: 36px; font-variant-numeric: tabular-nums; }
    td.t { width: 90px; }
    .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #f1f5f9; color: #334155; text-transform: uppercase; letter-spacing: .03em; }
    .tag.click { background: #eef2ff; color: #4338ca; } .tag.type { background: #ecfdf5; color: #047857; }
    .tag.key { background: #fef3c7; color: #92400e; } .tag.scroll { background: #f0f9ff; color: #0369a1; }
    .desc { max-width: 520px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    td.note textarea { width: 100%; min-width: 220px; height: 34px; resize: vertical; font-size: 13px; }
    td.z { width: 120px; }
    td.d { width: 74px; }
    td.d input { width: 66px; font-size: 12px; padding: 5px 6px; }
    td.z select { font-size: 12px; padding: 5px 6px; width: 112px; }
    td.x { width: 40px; text-align: right; }
    td.note textarea.nar { margin-top: 4px; background: #f5f3ff; }
    #narr .row, #narr audio { margin-bottom: 8px; }
    #narr audio { width: 100%; }
    a.btnlink { font-size: 14px; padding: 8px 14px; border-radius: 8px; border: 1px solid #d1d5db; background: #fff; color: inherit; text-decoration: none; }
    details.card summary { cursor: pointer; }
    fieldset input[type=password], fieldset input[type=text] { flex: 0 1 190px; min-width: 0; width: 190px; }
    .bad { color: #b91c1c; }
    td.x button { padding: 4px 9px; color: var(--m); }
    #progress { font-size: 13px; color: var(--m); }
    .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-top: 14px; }
    fieldset { border: 1px solid var(--b); border-radius: 10px; padding: 10px 14px 12px; margin: 0; display: grid; gap: 8px; align-content: start; min-width: 0; }
    legend { font-size: 12px; font-weight: 600; color: var(--m); text-transform: uppercase; letter-spacing: .04em; padding: 0 4px; }
    fieldset label { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
    fieldset label.chk { justify-content: flex-start; }
    fieldset select { flex: 0 1 190px; min-width: 0; width: 190px; }
    fieldset label span { flex: none; }
    code { font-size: 12px; background: #f1f5f9; padding: 1px 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <aside id="aside">
    <h1>Recordings</h1>
    <div class="import">
      <button id="import-btn">⬆ Import demo</button>
      <input type="file" id="import-file" accept=".html,.htm,text/html" hidden>
      <div class="muted">or drop a .demo.html file here</div>
      <div id="import-msg"></div>
      <a class="setlink" href="#settings">⚙ Settings (ElevenLabs key)</a>
    </div>
    <div id="sessions"></div>
  </aside>
  <main id="main">
    <div class="empty">Select a recording, or start one from the toolbar button.</div>
  </main>
  <template id="editor">
    <input id="title" type="text" spellcheck="false">
    <div class="muted" id="meta"></div>
    <div class="card">
      <div class="row">
        <button id="preview">▶ Preview</button>
        <button id="export" class="primary">⬇ Export HTML</button>
        <span id="progress"></span>
        <span style="flex:1"></span>
        <button id="delete" class="danger">Delete recording</button>
      </div>
      <div class="opts">
        <fieldset>
          <legend>Playback</legend>
          <label><span>Mode</span>
            <select data-setting="mode"><option value="autoplay">Autoplay</option><option value="guided">Guided (click to advance)</option></select></label>
          <label><span>When opened</span>
            <select data-setting="autoStart"><option value="false">Wait for Play</option><option value="true">Start automatically</option></select></label>
          <label><span>Speed</span>
            <select data-setting="speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
          <label title="Natural: each step paced by its animations. As recorded: each step lasts as long as in the original recording or video (keeps the voice-over in sync)."><span>Pace</span>
            <select data-setting="timing"><option value="auto">Natural</option><option value="recorded">As recorded</option></select></label>
          <label class="chk"><input type="checkbox" data-setting="loop"> Loop when finished</label>
        </fieldset>
        <fieldset>
          <legend>Display</legend>
          <label class="chk"><input type="checkbox" data-setting="controls"> Control bar (play, timeline, speed)</label>
          <label class="chk"><input type="checkbox" data-setting="browserFrame"> Browser frame with URL bar</label>
          <label class="chk"><input type="checkbox" data-setting="cursor"> Mouse cursor &amp; click effects</label>
          <label class="chk" title="Overlay like “Alt + K” when a key or shortcut was pressed"><input type="checkbox" data-setting="showKeys"> Key presses (e.g. Alt + K)</label>
          <label class="chk"><input type="checkbox" data-setting="captions"> Captions</label>
          <label class="chk"><input type="checkbox" data-setting="subtitles"> Narration subtitles</label>
          <label class="chk" title="The view zooms in on each click and typing step. Turn it off for single steps in the list below."><input type="checkbox" data-setting="zoom"> Auto-zoom on clicks &amp; typing</label>
          <label><span>Zoom level</span>
            <select data-setting="zoomLevel"><option value="1.5">1.5×</option><option value="1.8">1.8×</option><option value="2.2">2.2×</option></select></label>
          <label><span>Background</span>
            <select data-setting="background"><option value="dark">Dark</option><option value="light">Light</option><option value="none">None (for embedding)</option></select></label>
        </fieldset>
        <fieldset>
          <legend>File</legend>
          <label class="chk"><input type="checkbox" id="inline" checked> Embed images &amp; fonts (works offline)</label>
          <div class="muted">Settings are saved with the recording and used by Preview and Export. Viewers can still override them in the URL, e.g. <code>?controls=0&amp;autoplay=1</code>.</div>
        </fieldset>
      </div>
    </div>
    <div class="card" id="narr" hidden>
      <div class="row">
        <b>🎙 Narration</b>
        <span class="muted" id="narr-info"></span>
        <span style="flex:1"></span>
        <button id="use-live" hidden>Use live transcript</button>
        <button id="transcribe">Transcribe with ElevenLabs</button>
        <a id="narr-dl" class="btnlink">⬇ Download audio</a>
      </div>
      <div class="muted" id="narr-key" style="margin-bottom:8px"></div>
      <audio id="narr-audio" controls preload="metadata"></audio>
      <div class="muted" id="narr-status"></div>
    </div>
    <div class="card">
      <div class="muted" style="margin-bottom:8px">Steps — delete noise, add captions (shown as callouts) and narration (the spoken text, shown as subtitles; later voiced with ElevenLabs).</div>
      <table><tbody id="steps"></tbody></table>
    </div>
  </template>
  <template id="settings-view">
    <h2 style="margin:4px 0 4px">⚙ Settings</h2>
    <div class="muted">Set once, used by every recording (including imported ones). Stored only in this browser's extension storage.</div>
    <div class="opts">
      <fieldset>
        <legend>ElevenLabs speech-to-text</legend>
        <label><span>API key</span><span class="keyrow"><input type="password" data-pref="elKey" autocomplete="off" placeholder="sk_…"><button type="button" id="key-show" title="Show / hide">👁</button></span></label>
        <label><span>Model</span><input type="text" data-pref="elModel" placeholder="scribe_v2"></label>
        <label><span>Language</span>
          <select data-pref="elLang"><option value="">Same as recording / detect</option><option value="en">English</option><option value="es">Spanish</option><option value="ca">Catalan</option><option value="fr">French</option><option value="de">German</option><option value="it">Italian</option><option value="pt">Portuguese</option><option value="nl">Dutch</option></select></label>
        <div class="row"><button type="button" id="key-test">Test key</button><span id="key-result" class="muted"></span></div>
        <div class="muted">The key needs the <b>Speech to Text</b> permission (ElevenLabs → Developers → API keys). Audio is sent to ElevenLabs only when you click “Transcribe with ElevenLabs” on a recording.</div>
      </fieldset>
      <fieldset>
        <legend>Live transcript (Google Chrome)</legend>
        <label><span>Language</span>
          <select data-pref="narrationLang"></select></label>
        <div class="muted">Free, runs in the small Narration window while you record (Google Chrome only; Chrome sends the audio to Google). Also set in the popup, with a microphone test.</div>
      </fieldset>
    </div>
  </template>
  <script src="review.js" type="module"></script>
</body>
</html>
