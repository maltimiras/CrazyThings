<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Demo Recorder · Microphone</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; color: #111827; background: #f8fafc; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 28px 32px; max-width: 440px; text-align: center; }
    h1 { font-size: 19px; margin: 0 0 8px; }
    p { color: #4b5563; margin: 0 0 18px; }
    button { font: inherit; font-weight: 600; background: #4f46e5; color: #fff; border: 0; border-radius: 9px; padding: 10px 18px; cursor: pointer; }
    .ok { color: #047857; font-weight: 600; }
    .err { color: #b91c1c; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎙 Allow the microphone</h1>
    <p>Demo Recorder records your narration while you record a demo. Chrome asks for microphone access once.</p>
    <button id="allow">Allow microphone</button>
    <p id="msg" style="margin:16px 0 0"></p>
  </div>
  <script src="mic-setup.js" type="module"></script>
</body>
</html>
