<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px/1.4 system-ui, sans-serif; margin: 0; width: 280px; color: #111827; }
    header { padding: 12px 14px; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; gap: 8px; }
    header b { font-size: 14px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #9ca3af; }
    .rec .dot { background: #dc2626; animation: p 1.2s infinite; }
    .paused .dot { background: #d97706; }
    @keyframes p { 50% { opacity: .3; } }
    main { padding: 12px 14px; display: grid; gap: 8px; }
    button { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; }
    button.primary { background: #4f46e5; color: #fff; border-color: #4f46e5; font-weight: 600; }
    button.danger { background: #dc2626; color: #fff; border-color: #dc2626; font-weight: 600; }
    button:hover { filter: brightness(.96); }
    .muted { color: #6b7280; font-size: 12px; }
    .err { color: #b91c1c; font-size: 12px; }
    .size { display: grid; gap: 6px; padding: 10px; border: 1px solid #e5e7eb; border-radius: 10px; }
    .size label { font-weight: 600; font-size: 12px; color: #374151; }
    .size label.chk { font-weight: 400; display: flex; gap: 6px; align-items: center; }
    .size select, .size input[type=number] { font: inherit; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 8px; }
    .size input[type=number] { width: 84px; }
    .row { display: flex; gap: 6px; align-items: center; justify-content: space-between; }
    button.small { padding: 4px 8px; font-size: 12px; }
    .warn { color: #b45309; font-size: 12px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header id="hdr"><span class="dot"></span><b>Demo Recorder</b><span id="status" class="muted"></span></header>
  <main>
    <div id="idle">
      <div style="display:grid;gap:8px">
        <div class="size">
          <label for="size">Recording size</label>
          <select id="size">
            <option value="current">Current window</option>
            <option value="1280x720">1280 × 720</option>
            <option value="1366x768">1366 × 768</option>
            <option value="1440x900">1440 × 900</option>
            <option value="1536x864">1536 × 864</option>
            <option value="1920x1080">1920 × 1080</option>
            <option value="custom">Custom…</option>
          </select>
          <div id="custom" class="row" hidden>
            <input id="cw" type="number" min="320" max="7680" placeholder="width"> ×
            <input id="ch" type="number" min="240" max="4320" placeholder="height">
          </div>
          <div class="row"><span id="cursize" class="muted"></span><button id="resize" class="small">Resize now</button></div>
          <label class="chk"><input type="checkbox" id="restore" checked> Restore window size after recording</label>
        </div>
        <button id="start" class="primary">● Start recording this tab</button>
        <div class="muted">Clicks, typing, keyboard shortcuts, scrolling and page changes are captured. Password values are masked.</div>
      </div>
    </div>
    <div id="active" hidden>
      <div style="display:grid;gap:8px">
        <div class="muted" id="counter"></div>
        <button id="pause">❚❚ Pause</button>
        <button id="stop" class="danger">■ Stop &amp; review</button>
      </div>
    </div>
    <button id="library">Open recordings</button>
    <div id="warn" class="warn"></div>
    <div id="err" class="err"></div>
  </main>
  <script src="popup.js" type="module"></script>
</body>
</html>
